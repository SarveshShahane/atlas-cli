services:
  postgres:
    image: postgres:18-alpine
    container_name: atlas_postgres
    ports:
      - "${DB_PORT}:5432"
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    container_name: atlas_redis
    env_file:
      - .env.docker
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
